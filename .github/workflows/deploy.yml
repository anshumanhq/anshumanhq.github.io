name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false   # ✅ यहाँ बदलाव किया है

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Build Astro
        run: |
          cd portfolio-astro
          npm install
          npm run build
        continue-on-error: true

      - name: Check if build succeeded
        id: check_build
        run: |
          if [ -d "portfolio-astro/dist" ] && [ -f "portfolio-astro/dist/index.html" ]; then
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "build_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare deployment (Astro build)
        if: steps.check_build.outputs.build_success == 'true'
        run: |
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.xml" -o -name "*.txt" \) -delete
          cp -r portfolio-astro/dist/* .
          echo "✅ Astro build deployed to root."

      - name: Skip deployment (build failed - keep old site)
        if: steps.check_build.outputs.build_success == 'false'
        run: |
          echo "⚠️ Astro build failed. Keeping existing static site as fallback."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4